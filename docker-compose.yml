services:
  mysql:
    image: mysql:8.0
    container_name: devflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: devflow
      MYSQL_USER: devflow
      MYSQL_PASSWORD: devflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - devflow_mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    container_name: devflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: devflow-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: devflow
      RABBITMQ_DEFAULT_PASS: devflow
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - devflow_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  devflow_mysql_data:
  devflow_redis_data:
  devflow_rabbitmq_data:
