name: Playwright E2E Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: devflow-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright UI and API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: devflow
          MYSQL_USER: devflow
          MYSQL_PASSWORD: devflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: devflow
          RABBITMQ_DEFAULT_PASS: devflow
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "devflow:devflow@tcp(127.0.0.1:3306)/devflow?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "127.0.0.1:6379"
      RABBITMQ_URL: "amqp://devflow:devflow@127.0.0.1:5672/"
      AUTO_MIGRATE: "true"
      JWT_SECRET: "devflow-e2e-ci-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json

      - name: Run RabbitMQ reliability tests
        run: go test ./internal/mq ./internal/worker -count=1

      - name: Download Go modules
        run: go mod download

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Install E2E dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Type-check E2E tests
        run: npm run typecheck
        working-directory: tests/e2e

      - name: Run Playwright tests
        run: npm test
        working-directory: tests/e2e

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: tests/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-report
          path: tests/e2e/test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
