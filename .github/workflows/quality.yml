name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build:
    name: Unit tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

  api-tests:
    name: pytest API regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: devflow
          MYSQL_USER: devflow
          MYSQL_PASSWORD: devflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3.13-alpine
        env:
          RABBITMQ_DEFAULT_USER: devflow
          RABBITMQ_DEFAULT_PASS: devflow
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "devflow:devflow@tcp(127.0.0.1:3306)/devflow?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "127.0.0.1:6379"
      RABBITMQ_URL: "amqp://devflow:devflow@127.0.0.1:5672/"
      AUTO_MIGRATE: "true"
      JWT_SECRET: "devflow-api-ci-secret"
      DEVFLOW_BASE_URL: "http://127.0.0.1:8080"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/api/requirements.txt

      - name: Install API test dependencies
        run: python -m pip install -r tests/api/requirements.txt

      - name: Run RabbitMQ integration tests
        run: go test ./internal/mq ./internal/worker -count=1

      - name: Build API server
        run: go build -o ./devflow-server ./cmd/server

      - name: Start API server
        run: |
          nohup ./devflow-server > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run pytest
        working-directory: tests/api
        run: python -m pytest

      - name: Install Allure CLI
        run: |
          curl -fsSL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.43.0/allure-2.43.0.tgz
          tar -xzf allure.tgz

      - name: Generate Allure report
        working-directory: tests/api
        run: ../../allure-2.43.0/bin/allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-report
          path: tests/api/allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload API server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-server-log
          path: server.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop API server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

  e2e:
    name: Playwright UI regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: devflow
          MYSQL_USER: devflow
          MYSQL_PASSWORD: devflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "devflow:devflow@tcp(127.0.0.1:3306)/devflow?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "127.0.0.1:6379"
      DEVFLOW_E2E_RABBITMQ_URL: ""
      AUTO_MIGRATE: "true"
      JWT_SECRET: "devflow-e2e-ci-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json

      - name: Download Go modules
        run: go mod download

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Type-check Playwright tests
        working-directory: tests/e2e
        run: npm run typecheck

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test

      - name: Install Allure CLI
        run: |
          curl -fsSL -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.43.0/allure-2.43.0.tgz
          tar -xzf allure.tgz

      - name: Generate Allure report
        working-directory: tests/e2e
        run: ../../allure-2.43.0/bin/allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-allure-report
          path: tests/e2e/allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: tests/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
