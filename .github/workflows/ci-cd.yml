name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: devflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/devflow_deploy_key
          chmod 600 ~/.ssh/devflow_deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Create release bundle
        run: git bundle create /tmp/devflow-main.bundle HEAD

      - name: Upload release bundle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          scp -i ~/.ssh/devflow_deploy_key -P "${DEPLOY_PORT:-22}" /tmp/devflow-main.bundle "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/devflow-main.bundle"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/devflow_deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" <<EOF
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          git fetch /tmp/devflow-main.bundle HEAD
          git checkout -f FETCH_HEAD
          git branch -f main FETCH_HEAD
          git checkout main
          docker compose --env-file .env.prod -f docker-compose.prod.yml build app web seed
          docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm -e AUTO_MIGRATE=true seed
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d app web
          docker compose --env-file .env.prod -f docker-compose.prod.yml ps
          curl -fsS http://127.0.0.1:8081/api/healthz
          curl -fsSI http://127.0.0.1:8081/ | head -20
          EOF
