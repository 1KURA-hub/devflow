name: devflow-personal

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: devflow
      MYSQL_USER: devflow
      MYSQL_PASSWORD: devflow
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    cpus: 2

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: devflow
      RABBITMQ_DEFAULT_PASS: devflow
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    cpus: 1

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: test
      HTTP_ADDR: :8080
      MYSQL_DSN: devflow:devflow@tcp(mysql:3306)/devflow?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://devflow:devflow@rabbitmq:5672/
      AUTO_MIGRATE: "false"
      JWT_SECRET: devflow-remote-test-secret-change-before-production
      DISABLE_WORKERS: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 2

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "28081:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cpus: 1

  api-tests:
    image: python:3.12-slim
    profiles: ["test"]
    working_dir: /workspace/tests/api
    environment:
      DEVFLOW_BASE_URL: http://web
      DEVFLOW_NOTIFY_TIMEOUT: "10"
    volumes:
      - .:/workspace
      - pip_cache:/root/.cache/pip
    depends_on:
      web:
        condition: service_healthy
    command: ["sh", "-lc", "pip install -r requirements.txt && pytest --junitxml=report.xml"]
    mem_limit: 1g
    cpus: 2

  go-tests:
    image: golang:1.24-alpine
    profiles: ["test"]
    working_dir: /workspace
    environment:
      APP_ENV: test
      RABBITMQ_URL: amqp://devflow:devflow@rabbitmq:5672/
      GOPROXY: https://goproxy.cn,direct
    volumes:
      - .:/workspace
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["go", "test", "./...", "-count=1"]
    mem_limit: 2g
    cpus: 3

  e2e-tests:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    profiles: ["test"]
    working_dir: /workspace/tests/e2e
    environment:
      CI: "true"
      DEVFLOW_E2E_EXTERNAL: "true"
      DEVFLOW_WEB_URL: http://web
      DEVFLOW_API_URL: http://web
    volumes:
      - .:/workspace
      - e2e_node_modules:/workspace/tests/e2e/node_modules
    depends_on:
      web:
        condition: service_healthy
    command: ["sh", "-lc", "npm ci && npm run typecheck && npm test"]
    shm_size: 1gb
    mem_limit: 3g
    cpus: 3

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  uploads:
  pip_cache:
  go_modules:
  go_build_cache:
  e2e_node_modules:
