services:
  mysql:
    image: mysql:8.0
    container_name: devflow-prod-mysql
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - devflow_prod_mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    container_name: devflow-prod-redis
    restart: unless-stopped
    volumes:
      - devflow_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: devflow-prod-rabbitmq
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - devflow_prod_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devflow-prod-app
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - devflow_prod_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devflow-prod-seed
    env_file:
      - .env.prod
    depends_on:
      mysql:
        condition: service_healthy
    command: ["/app/seed"]
    restart: "no"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: devflow-prod-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  devflow_prod_mysql_data:
  devflow_prod_redis_data:
  devflow_prod_rabbitmq_data:
  devflow_prod_uploads:
